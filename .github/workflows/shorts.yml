name: Uppdatera blankning

on:
  schedule:
    # Dagligen: FI publicerar löpande, filen uppdateras normalt under natten
    - cron: "20 5 * * *"
    - cron: "40 16 * * 1-5"
  push:
    paths:
      - "scripts/fetch_shorts.py"
      - "scripts/analyze_shorts.py"
      - "data/shorts_config.json"
      - ".github/workflows/shorts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  shorts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Testa FI-varianter
        run: |
          U=https://www.fi.se/BlankningsRegister/GetHistFile
          B="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          for i in 1 2; do
            echo "curl default: $(curl -s -o /tmp/a -w '%{http_code} %{content_type} %{size_download}' $U)"
            echo "curl browser: $(curl -s -o /tmp/b -w '%{http_code} %{content_type} %{size_download}' -A "$B" $U)"
            echo "curl browser+accept: $(curl -s -o /tmp/c -w '%{http_code} %{content_type} %{size_download}' -A "$B" -H 'Accept: text/html,application/xhtml+xml,*/*;q=0.8' -H 'Accept-Language: sv-SE,sv;q=0.9' $U)"
            echo "curl cookies: $(curl -s -c /tmp/j -b /tmp/j -o /dev/null -w '%{http_code}' -A "$B" https://www.fi.se/sv/vara-register/blankningsregistret/) $(curl -s -c /tmp/j -b /tmp/j -o /tmp/d -w '%{http_code} %{content_type} %{size_download}' -A "$B" -H 'X-Requested-With: XMLHttpRequest' $U)"
            echo "curl http1.1: $(curl -s --http1.1 -o /tmp/e -w '%{http_code} %{content_type} %{size_download}' -A "$B" $U)"
            echo "curl -I: $(curl -sI -A "$B" $U | head -12 | tr '\r\n' '  ')"
            sleep 3
          done

        run: python3 scripts/fetch_shorts.py
        env:
          FI_DEBUG: "1"
      - name: Analysera
        run: if [ -f scripts/analyze_shorts.py ]; then python3 scripts/analyze_shorts.py; fi
      - name: Spara
        run: |
          git config user.name "blankning-bot"
          git config user.email "blankning-bot@users.noreply.github.com"
          git add data/fi data/short_prices.json data/shorts.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Inga ändringar"; exit 0; fi
          git commit -m "Blankning $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push
